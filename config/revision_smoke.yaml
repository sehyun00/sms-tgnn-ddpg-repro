project:
  name: sms-revision-smoke
  experiment_id: smoke-v1
  device: cpu
  deterministic: true

paths:
  prepared_dir: data/revision/smoke-v1
  results_dir: results/revision/smoke-v1

data:
  provider: csv
  raw_prices_path: tests/fixtures/sample_prices.csv
  source_start: "2020-01-01"
  source_end_exclusive: "2021-07-01"
  universe:
    selection_salt: smoke-v1
    minimum_coverage: 0.95
    per_sector_train: 1
    reserve_size: 0
    exact_test_symbols: [AAA, BBB, CCC]
    configured_train_symbols: [AAA, BBB, CCC]
    configured_reserve_symbols: []
  window_size: 20
  graph_lookback: 20
  target_horizons: [1, 5, 21, 63]
  target_heads:
    Return1D: ForwardReturn1D
    Return1W: ForwardReturn5D
    Return1M: ForwardReturn21D
    Return1Q: ForwardReturn63D
  features: [Ret1D, OpenRel, HighRel, LowRel, CloseRel20, VolumeZ20, Momentum5, Momentum21, Volatility20, RSI14, MACDHist]
  macro_features: [Mkt_RF, SMB, HML, RMW, CMA]

folds:
  primary:
    train: {start: "2020-02-03", end: "2020-06-30"}
    validation: {start: "2020-07-01", end: "2020-09-30"}
    test: {start: "2020-10-01", end: "2021-06-30"}
    seeds: [42]
  secondary:
    train: {start: "2020-02-03", end: "2020-04-30"}
    validation: {start: "2020-05-01", end: "2020-07-31"}
    test: {start: "2020-08-03", end: "2020-10-30"}
    seeds: [42]

model:
  softmax_temperature: 2.0
  tgnn: {hidden_dim: 32, num_heads: 4, dropout: 0.1, learning_rate: 0.001, mse_weight: 0.7, ranking_weight: 0.3}
  ddpg: {actor_lr: 0.001, critic_lr: 0.001, gamma: 0.95, tau: 0.01, batch_size: 2, entropy_coefficient: 0.0, noise_start: 0.10, noise_end: 0.05}
  td3: {actor_lr: 0.001, critic_lr: 0.001, gamma: 0.95, tau: 0.01, batch_size: 2, target_noise: 0.10, noise_clip: 0.20, policy_delay: 2, noise_start: 0.10, noise_end: 0.05}
  alpha: {minimum: 0.1, maximum: 0.9, hidden_dim: 32, learning_rate: 0.001, epochs: 2, patience: 2}

training:
  tgnn_max_epochs: 1
  tgnn_early_stopping_patience: 1
  rl_max_epochs: 1
  rl_early_stopping_patience_evaluations: 1
  gradient_steps_per_epoch: 2
  evaluation_interval: 1
  checkpoint_interval: 1
  batch_size: 4
  buffer_size: 256
  training_cost_bps: 10

backtest:
  initial_capital: 1000000
  frequencies: [monthly]
  primary_frequency: monthly
  cost_bps: [0, 10]
  primary_cost_bps: 10
  covariance_lookback: 20
  graph_modes: [sector, correlation, combined]
  primary_graph: combined

statistics:
  bootstrap_iterations: 50
  block_length: 5
  confidence_level: 0.95
  primary_model: hybrid
  primary_comparators: [tgnn, ddpg, td3, hybrid_fixed, equal_weight]

xai:
  dates: 2
  mask_fraction: 0.10
  random_masks_per_date: 2
  faithfulness_fraction_threshold: 0.75
  seed: 42
